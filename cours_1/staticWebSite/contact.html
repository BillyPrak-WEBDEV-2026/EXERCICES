<!DOCTYPE html>

<head>

    <title>Contact</title>
</head>
<body>
    <header>
        <h1>Me contacter</h1>
        <nav>
            <div id="menuBtn" class="menu-btn">
                <span class="menu-icon"></span>
            </div>
            <div id="menu-flex" class="menu-flex">

                    <li><a href="experiences.html">Mon parcours</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <main>
        <section>
            <h2>Formulaire de contact</h2>
            <form>
                <label for="name">Nom :</label><br>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email :</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="objet">Objet :</label><br>
                <input type="text" id="objet" name="objet" required><br><br>

                <label for="message">Message :</label><br>
                <textarea id="message" name="message" rows="5" required></textarea><br><br>

                <button type="submit">Envoyer</button>
            </form>
        </section>

        <section>
            <h3>Mes réseaux</h3>
            <ul>
                <li><a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">LinkedIn</a></li>
                <li><a href="https://www.github.com/billiack">GitHub</a></li>
            </ul>
            <h3>Localisation</h3>
            <iframe width="400" height="400" style="border:0" src="https://www.google.com/maps/embed/v1/place?key=AIzaSyB2NIWI3Tv9iDPrlnowr_0ZqZWoAQydKJU&q=EFREI%20Paris%2030%2C%2032%20Avenue%20de%20la%20R%C3%A9publique%2C%20Villejuif%2C%20France&maptype=roadmap" allowfullscreen></iframe>
        </section>
    </main>
